version: '3.8'

services:
    db:
        container_name: postgres
        image: postgres:15
        restart: always
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
        ports:
            - '${DATABASE_PORT}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - diplom-project-backend

